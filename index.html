<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>三角形ABCをx軸のまわりに回転してできる立体</title>
<style>
  body { margin:0; overflow:hidden; font-family: "Hiragino Sans","Meiryo",sans-serif; background:#10141c; color:#eee; }
  #panel { position:absolute; top:10px; left:10px; width:330px; background:rgba(20,25,35,0.92);
           padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.8; z-index:10; }
  #panel h1 { font-size:15px; margin:0 0 6px; }
  #panel label { display:block; margin-top:6px; }
  #panel input[type=range] { width:100%; }
  button { margin-top:6px; padding:4px 10px; border-radius:6px; border:none; background:#3a7bd5; color:#fff; cursor:pointer; }
  #sec { position:absolute; right:10px; top:10px; background:rgba(20,25,35,0.92); border-radius:10px; padding:8px; z-index:10; font-size:12px; }
  .lbl { color:#fff; font-weight:bold; font-size:15px; text-shadow:0 0 4px #000; }
  .ax  { color:#ccc; font-size:14px; }
  .val { color:#ffd166; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>.katex { font-size: 1.05em; } #panel .katex-display { margin: 4px 0; }</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="panel">
  <h1>△ABC を x軸のまわりに1回転</h1>
  A(2,1,2), B(0,3,0), C(0,−3,0)
  <label>回転角 θ = <span id="thv" class="val">0</span>°
    <input id="theta" type="range" min="0" max="360" step="1" value="0"></label>
  <button id="play">▶ 回転アニメーション</button>
  <label><input id="showSolid" type="checkbox" checked> 立体を表示</label>
  <label><input id="cut" type="checkbox"> 断面カット（内部の空洞を見る）</label>
  <label><input id="wire" type="checkbox"> ワイヤーフレーム</label>
  <label>立体の不透明度 <input id="op" type="range" min="0.1" max="1" step="0.05" value="0.45"></label>
  <label>切断面 x = <span id="cv" class="val">1.00</span>
    <input id="cx" type="range" min="0" max="2" step="0.01" value="1"></label>
  <label><input id="showSec" type="checkbox" checked> 切断面（円環）を表示</label>
  <hr>
  外半径：<span id="Rform"></span> = <span id="Rv" class="val"></span><br>
  内半径：<span id="rform"></span> = <span id="rv" class="val"></span><br>
  断面積：<span id="Sform"></span> = <span id="Sv" class="val"></span><br>
  体積：<span id="Vform" class="val"></span>
</div>
<div id="sec">x = <span id="cv2">1.00</span> での切り口（yz平面）<br><canvas id="cv2d" width="260" height="260"></canvas></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------- 数式 ----------
const Rf = x => Math.sqrt((3-x)**2 + x**2);
const rf = x => x <= 1.5 ? x : Math.sqrt((2*x-3)**2 + x**2);

// ---------- 基本セットアップ ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141c);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.up.set(0,0,1);                 // z軸を上に
camera.position.set(8,-7,5.5);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style,{position:'absolute',top:'0',pointerEvents:'none'});
document.body.appendChild(labelRenderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1,0,0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff,0.55));
const dl = new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(5,-5,8); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff,0.4); dl2.position.set(-5,5,-4); scene.add(dl2);

function label(text, cls, pos, parent=scene){
  const d=document.createElement('div'); d.className=cls; d.textContent=text;
  const o=new CSS2DObject(d); o.position.copy(pos); parent.add(o); return o;
}

// ---------- 座標軸 ----------
const L=4.2;
[[1,0,0,0xff6666,'x'],[0,1,0,0x66ff66,'y'],[0,0,1,0x6699ff,'z']].forEach(([a,b,c,col,n])=>{
  const dir=new THREE.Vector3(a,b,c);
  scene.add(new THREE.ArrowHelper(dir,dir.clone().multiplyScalar(-L),2*L,col,0.25,0.12));
  label(n,'ax',dir.clone().multiplyScalar(L+0.3));
});
label('O','ax',new THREE.Vector3(-0.2,-0.2,-0.2));

// ---------- 回転体 ----------
function profile(n=240){
  const p=[];
  for(let i=0;i<=n;i++){ const x=2*i/n; p.push(new THREE.Vector2(Rf(x),x)); }
  for(let i=n;i>=0;i--){ const x=2*i/n; p.push(new THREE.Vector2(rf(x),x)); }
  return p;
}
const prof = profile();
const solidMat = new THREE.MeshPhongMaterial({color:0x4fa3ff,transparent:true,opacity:0.45,
  side:THREE.DoubleSide,depthWrite:false,shininess:60});
const solidGroup = new THREE.Group(); scene.add(solidGroup);

function buildSolid(cut){
  solidGroup.clear();
  const phiLen = cut ? Math.PI*1.5 : Math.PI*2;
  const g = new THREE.LatheGeometry(prof, 160, 0, phiLen);
  g.rotateZ(-Math.PI/2);              // 回転軸 y → x
  solidGroup.add(new THREE.Mesh(g, solidMat));
  if(cut){                            // 切り口の面
    const shape = new THREE.Shape(prof.map(v=>new THREE.Vector2(v.y,v.x)));
    const cutMat = new THREE.MeshPhongMaterial({color:0xff9f43,side:THREE.DoubleSide});
    [0,phiLen].forEach(phi=>{
      const m=new THREE.Mesh(new THREE.ShapeGeometry(shape),cutMat);
      m.rotation.x = phi + Math.PI/2;
      solidGroup.add(m);
    });
  }
}
buildSolid(false);

// ---------- 三角形 ----------
const A=new THREE.Vector3(2,1,2), B=new THREE.Vector3(0,3,0), C=new THREE.Vector3(0,-3,0);
const triGeo = new THREE.BufferGeometry().setFromPoints([A,B,C]);
triGeo.setIndex([0,1,2]); triGeo.computeVertexNormals();
const triGroup = new THREE.Group(); scene.add(triGroup);
triGroup.add(new THREE.Mesh(triGeo,new THREE.MeshPhongMaterial({color:0xff4757,side:THREE.DoubleSide,transparent:true,opacity:0.85})));
triGroup.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([A,B,C]),new THREE.LineBasicMaterial({color:0xffffff})));
label('A','lbl',A.clone().add(new THREE.Vector3(0.1,0.1,0.25)),triGroup);
label('B','lbl',B.clone().add(new THREE.Vector3(0,0.25,0.15)),triGroup);
label('C','lbl',C.clone().add(new THREE.Vector3(0,-0.25,0.15)),triGroup);

// 切断線分（三角形とともに回転）
const segGeo = new THREE.BufferGeometry();
const seg = new THREE.Line(segGeo,new THREE.LineBasicMaterial({color:0xffd166}));
triGroup.add(seg);

// 残像
const trail = new THREE.Group(); scene.add(trail);
const trailMat = new THREE.MeshBasicMaterial({color:0xff6b81,transparent:true,opacity:0.07,side:THREE.DoubleSide,depthWrite:false});
for(let k=0;k<72;k++){ const m=new THREE.Mesh(triGeo,trailMat); m.rotation.x=k*5*Math.PI/180; m.visible=false; trail.add(m); }

// 頂点の軌跡
const paths=[A,B,C].map(P=>{
  const rad=Math.hypot(P.y,P.z), a0=Math.atan2(P.z,P.y), pts=[];
  for(let d=0; d<=360; d++){ const a=a0+d*Math.PI/180; pts.push(new THREE.Vector3(P.x,rad*Math.cos(a),rad*Math.sin(a))); }
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.7}));
  line.geometry.setDrawRange(0,1); scene.add(line); return line;
});

// ---------- 切断面（円環） ----------
const ringMat = new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,opacity:0.55,side:THREE.DoubleSide,depthWrite:false});
const ring = new THREE.Mesh(new THREE.BufferGeometry(), ringMat); scene.add(ring);
const planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(7.5,7.5).rotateY(Math.PI/2),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.06,side:THREE.DoubleSide,depthWrite:false}));
scene.add(planeMesh);

// ---------- UI ----------
const $=id=>document.getElementById(id);

// ---------- KaTeX による数式表示 ----------
const tex = (id, s) => katex.render(s, $(id), { throwOnError: false });
tex('Rform', String.raw`R(x)=\sqrt{(3-x)^2+x^2}`);
tex('Sform', String.raw`\pi\{R(x)^2-r(x)^2\}`);
tex('Vform', String.raw`V=\dfrac{17}{2}\pi\approx 26.704`);

let theta=0, c=1, playing=false;

function updateSection(){
  const Rv=Rf(c), rv=rf(c);
  ring.geometry.dispose();
  ring.geometry = new THREE.RingGeometry(rv, Math.max(Rv,rv+1e-4), 128).rotateY(Math.PI/2);
  ring.position.x=c; planeMesh.position.x=c;
  segGeo.setFromPoints([new THREE.Vector3(c,2*c-3,c),new THREE.Vector3(c,3-c,c)]);
  $('cv').textContent=$('cv2').textContent=c.toFixed(2);
  $('Rv').textContent=Rv.toFixed(3);
  tex('rform', c<=1.5
    ? String.raw`r(x)=x\ \ \left(0\le x\le \tfrac{3}{2}\right)`
    : String.raw`r(x)=\sqrt{(2x-3)^2+x^2}\ \ \left(\tfrac{3}{2}\le x\le 2\right)`);
  $('rv').textContent=rv.toFixed(3);
  $('Sv').textContent=(Math.PI*(Rv*Rv-rv*rv)).toFixed(3);
  draw2D();
}
function updateTheta(){
  const t=theta*Math.PI/180;
  triGroup.rotation.x=t;
  trail.children.forEach((m,k)=>m.visible = k*5 <= theta && theta>0);
  paths.forEach(p=>p.geometry.setDrawRange(0,Math.round(theta)+1));
  $('thv').textContent=Math.round(theta);
  draw2D();
}

// 2D 断面図
const cvs=$('cv2d'), ctx=cvs.getContext('2d');
function draw2D(){
  const W=cvs.width, s=W/7.6, o=W/2;
  const P=(y,z)=>[o+y*s,o-z*s];
  ctx.clearRect(0,0,W,W);
  ctx.strokeStyle='#555'; ctx.beginPath(); ctx.moveTo(0,o); ctx.lineTo(W,o); ctx.moveTo(o,0); ctx.lineTo(o,W); ctx.stroke();
  ctx.fillStyle='#aaa'; ctx.font='12px sans-serif'; ctx.fillText('y',W-12,o-4); ctx.fillText('z',o+4,12);
  const Rv=Rf(c), rv=rf(c);
  ctx.fillStyle='rgba(255,209,102,0.45)';
  ctx.beginPath(); ctx.arc(o,o,Rv*s,0,2*Math.PI); ctx.arc(o,o,rv*s,0,2*Math.PI,true); ctx.fill('evenodd');
  ctx.strokeStyle='#4fa3ff'; ctx.beginPath(); ctx.arc(o,o,Rv*s,0,2*Math.PI); ctx.stroke();
  ctx.strokeStyle='#ff9f43'; ctx.beginPath(); ctx.arc(o,o,rv*s,0,2*Math.PI); ctx.stroke();
  const t=theta*Math.PI/180, rot=(y,z)=>[y*Math.cos(t)-z*Math.sin(t), y*Math.sin(t)+z*Math.cos(t)];
  const p1=rot(2*c-3,c), p2=rot(3-c,c);
  ctx.strokeStyle='#ff4757'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(...P(...p1)); ctx.lineTo(...P(...p2)); ctx.stroke(); ctx.lineWidth=1;
  const near = c<=1.5 ? rot(0,c) : p1;
  ctx.setLineDash([4,3]);
  ctx.strokeStyle='#ff9f43'; ctx.beginPath(); ctx.moveTo(o,o); ctx.lineTo(...P(...near)); ctx.stroke();
  ctx.strokeStyle='#4fa3ff'; ctx.beginPath(); ctx.moveTo(o,o); ctx.lineTo(...P(...p2)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#4fa3ff'; ctx.fillText('R='+Rv.toFixed(2),6,W-22);
  ctx.fillStyle='#ff9f43'; ctx.fillText('r='+rv.toFixed(2),6,W-8);
}

$('theta').oninput=e=>{theta=+e.target.value; updateTheta();};
$('cx').oninput=e=>{c=+e.target.value; updateSection();};
$('play').onclick=()=>{ playing=!playing; $('play').textContent=playing?'■ 停止':'▶ 回転アニメーション'; if(playing&&theta>=360) theta=0; };
$('showSolid').onchange=e=>solidGroup.visible=e.target.checked;
$('cut').onchange=e=>buildSolid(e.target.checked);
$('wire').onchange=e=>solidMat.wireframe=e.target.checked;
$('op').oninput=e=>solidMat.opacity=+e.target.value;
$('showSec').onchange=e=>{ring.visible=planeMesh.visible=seg.visible=e.target.checked;};

updateSection(); updateTheta();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});
(function loop(){
  requestAnimationFrame(loop);
  if(playing){ theta=Math.min(360,theta+1.2); $('theta').value=theta; updateTheta(); if(theta>=360){playing=false;$('play').textContent='▶ 回転アニメーション';} }
  controls.update();
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
})();
</script>
</body>
</html>
